<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Vecino - Centros de Acopio</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            
            /* Badges colors */
            --color-plastico: #3b82f6; /* Blue */
            --color-vidrio: #10b981; /* Green */
            --color-papel: #f59e0b; /* Yellow/Orange */
            --color-metal: #6b7280; /* Gray */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* App Container */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Sidebar Glassmorphism */
        .sidebar {
            width: 420px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(226, 232, 240, 0.8);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(209, 250, 229, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .logo-icon {
            background: var(--primary);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .logo-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo-title span {
            color: var(--primary);
        }

        .sidebar-description {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Search & Filters */
        .search-filter-container {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: white;
        }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            background-color: var(--background);
        }

        .search-input:focus {
            border-color: var(--primary);
            background-color: white;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 18px;
            height: 18px;
        }

        .filter-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background-color: white;
            color: var(--text-muted);
            transition: all 0.2s ease;
            user-select: none;
        }

        .filter-tag:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
        }

        .filter-tag.active[data-type="Todos"] {
            background-color: var(--text-main);
            color: white;
            border-color: var(--text-main);
        }

        .filter-tag.active[data-type="Plástico"] {
            background-color: var(--color-plastico);
            color: white;
            border-color: var(--color-plastico);
        }

        .filter-tag.active[data-type="Vidrio"] {
            background-color: var(--color-vidrio);
            color: white;
            border-color: var(--color-vidrio);
        }

        .filter-tag.active[data-type="Papel"] {
            background-color: var(--color-papel);
            color: white;
            border-color: var(--color-papel);
        }

        .filter-tag.active[data-type="Metal"] {
            background-color: var(--color-metal);
            color: white;
            border-color: var(--color-metal);
        }

        /* Center list */
        .centers-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .centers-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .centers-list-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .centers-list-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        .centers-list-container::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .center-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .center-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: transparent;
            transition: background-color 0.2s ease;
        }

        .center-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .center-card.active {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
        }

        .center-card.active::before {
            background-color: var(--primary);
        }

        .center-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .center-detail {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .center-detail svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
        }

        .center-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-plastico {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--color-plastico);
        }

        .badge-vidrio {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--color-vidrio);
        }

        .badge-papel {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--color-papel);
        }

        .badge-metal {
            background-color: rgba(107, 114, 240, 0.1);
            color: var(--color-metal);
        }

        /* Map Area */
        .map-container {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Premium Leaflet Customizations */
        .leaflet-popup-content-wrapper {
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 6px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .leaflet-popup-tip {
            box-shadow: var(--shadow-md);
        }

        .popup-card {
            padding: 4px;
        }

        .popup-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .popup-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .popup-text svg {
            width: 12px;
            height: 12px;
            stroke-width: 2;
            fill: none;
            stroke: var(--text-muted);
        }

        /* Custom Marker */
        .custom-div-icon {
            background: transparent;
            border: none;
        }

        .marker-pin {
            width: 32px;
            height: 32px;
            border-radius: 50% 50% 50% 0;
            background: var(--primary);
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -16px 0 0 -16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .marker-pin::after {
            content: '';
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            position: absolute;
            transform: rotate(45deg);
        }

        .marker-pin:hover {
            transform: rotate(-45deg) scale(1.15);
            background: var(--primary-dark);
        }

        /* Empty state styling */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .empty-state svg {
            stroke: var(--text-muted);
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

        /* Mobile Toggle Button */
        .sidebar-toggle {
            display: none;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: white;
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        .sidebar-toggle svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-main);
            fill: none;
            stroke-width: 2;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -420px;
                top: 0;
                bottom: 0;
                width: 320px;
            }

            .sidebar.open {
                left: 0;
            }

            .sidebar-toggle {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir panel lateral">
        <svg viewBox="0 0 24 24">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-icon">🌱</div>
                    <h1 class="logo-title">Eco-<span>Vecino</span></h1>
                </div>
                <p class="sidebar-description">Encuentra los puntos ecológicos y centros de acopio autorizados en tu zona para reciclar de forma responsable.</p>
            </div>
            
            <!-- Search and Filter Panel -->
            <div class="search-filter-container">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre o dirección...">
                </div>
                
                <h3 class="filter-title">Filtrar por residuo</h3>
                <div class="filter-tags" id="filterTags">
                    <div class="filter-tag active" data-type="Todos">Todos</div>
                    <div class="filter-tag" data-type="Plástico">Plástico</div>
                    <div class="filter-tag" data-type="Vidrio">Vidrio</div>
                    <div class="filter-tag" data-type="Papel">Papel</div>
                    <div class="filter-tag" data-type="Metal">Metal</div>
                </div>
            </div>
            
            <!-- Dynamic Centers list -->
            <div class="centers-list-container" id="centersList">
                <!-- Spinned/Loaded Dynamically -->
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                    <p>Cargando centros de acopio...</p>
                </div>
            </div>
        </aside>
        
        <!-- Map container -->
        <main class="map-container">
            <div id="map"></div>
        </main>
        
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // State variables
        let map;
        let markers = [];
        let allCenters = [];
        let activeFilter = 'Todos';
        let searchQuery = '';
        
        // Leaflet Icons
        function createCustomPin(color) {
            return L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="marker-pin" style="background-color: ${color};"></div>`,
                iconSize: [30, 42],
                iconAnchor: [15, 42],
                popupAnchor: [0, -36]
            });
        }
        
        const pinColors = {
            'Default': '#10b981',
            'Plástico': '#3b82f6',
            'Vidrio': '#10b981',
            'Papel': '#f59e0b',
            'Metal': '#6b7280'
        };

        // Initialize Map
        function initMap() {
            // Center map on Lima/Peru coordinates by default
            map = L.map('map', {
                zoomControl: false // Move zoom control to bottom right
            }).setView([-12.1200, -77.0300], 13);
            
            // Add premium, clean Voyager map tiles from CartoDB
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);
            
            // Reposition zoom controls
            L.control.zoom({
                position: 'bottomright'
            }).addTo(map);
        }

        // Fetch centers from FastAPI API
        async function fetchCenters() {
            try {
                const response = await fetch('/centros/');
                if (!response.ok) throw new Error('Error al cargar datos');
                const data = await response.json();
                // Agregar tipos_residuos mockeado ya que la DB aún no lo soporta nativamente
                allCenters = data.map(c => ({
                    ...c,
                    tipos_residuos: c.tipos_residuos || ['Plástico', 'Vidrio', 'Papel']
                }));
                renderApp();
            } catch (error) {
                console.error(error);
                document.getElementById('centersList').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>No se pudieron cargar los centros de acopio. Asegúrese de que el servidor esté activo.</p>
                    </div>`;
            }
        }

        // Render application elements (list & map markers) based on active search/filters
        function renderApp() {
            // Filter centers
            const filteredCenters = allCenters.filter(center => {
                const matchesSearch = center.nombre.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     center.direccion.toLowerCase().includes(searchQuery.toLowerCase());
                
                const matchesFilter = activeFilter === 'Todos' || center.tipos_residuos.includes(activeFilter);
                
                return matchesSearch && matchesFilter;
            });

            // 1. Clear existing markers
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            // 2. Render List and Add New Markers
            const listContainer = document.getElementById('centersList');
            listContainer.innerHTML = '';

            if (filteredCenters.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <p>No se encontraron centros que coincidan con la búsqueda.</p>
                    </div>`;
                return;
            }

            filteredCenters.forEach(center => {
                // Determine marker color based on first waste type or main type
                const primaryType = center.tipos_residuos[0] || 'Default';
                const pinColor = pinColors[primaryType] || pinColors['Default'];
                
                // Create map marker
                const marker = L.marker([center.lat, center.lng], {
                    icon: createCustomPin(pinColor)
                });
                
                // Add popup content
                const popupContent = `
                    <div class="popup-card">
                        <div class="popup-title">${center.nombre}</div>
                        <div class="popup-text">
                            <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
                            ${center.direccion}
                        </div>
                        <div class="popup-text">
                            <svg viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            ${center.horario}
                        </div>
                    </div>
                `;
                marker.bindPopup(popupContent);
                marker.addTo(map);
                
                // Bind markers mapping reference
                center.marker = marker;
                markers.push(marker);

                // Create side list item
                const card = document.createElement('div');
                card.className = 'center-card';
                card.dataset.id = center.id;
                
                // Build badges HTML
                const badgesHTML = center.tipos_residuos.map(type => {
                    const typeClass = type.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    return `<span class="badge badge-${typeClass}">${type}</span>`;
                }).join('');

                card.innerHTML = `
                    <div class="center-name">${center.nombre}</div>
                    <div class="center-detail">
                        <svg viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
                        <span>${center.direccion}</span>
                    </div>
                    <div class="center-detail">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span>${center.horario}</span>
                    </div>
                    <div class="center-badges">${badgesHTML}</div>
                `;

                // Handle click on list card
                card.addEventListener('click', () => {
                    // Remove active class from other cards
                    document.querySelectorAll('.center-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    
                    // Center map on marker and open popup
                    map.setView([center.lat, center.lng], 15, {
                        animate: true,
                        duration: 0.8
                    });
                    marker.openPopup();

                    // If mobile view, close sidebar on select
                    if (window.innerWidth <= 768) {
                        document.getElementById('sidebar').classList.remove('open');
                    }
                });

                listContainer.appendChild(card);
            });
            
            // Adjust map view bounds to encompass all visible markers if any
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.15));
            }
        }

        // Setup Event Listeners
        function setupListeners() {
            // Search filter listener
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderApp();
            });

            // Filter tags listener
            const filterTags = document.getElementById('filterTags');
            filterTags.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-tag')) {
                    // Update active class
                    document.querySelectorAll('.filter-tag').forEach(tag => tag.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    activeFilter = e.target.dataset.type;
                    renderApp();
                }
            });

            // Mobile menu toggle
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });

            // Close mobile sidebar click outside
            document.getElementById('map').addEventListener('click', () => {
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                }
            });
        }

        // Init App on Load
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            setupListeners();
            fetchCenters();
        });
    </script>
</body>
</html>
